name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Install VS Code test host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxdamage1 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            xvfb

      - name: Run tests
        run: xvfb-run -a npm run test:only

      - name: Package VSIX
        run: npx vsce package --no-dependencies
        
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: aider-chat-vsix
          path: "*.vsix"
